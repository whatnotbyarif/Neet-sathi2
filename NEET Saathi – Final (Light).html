<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEET Saathi</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --g{syntax:'<color>';inherits:true;initial-value:#2F6BFF}
*{box-sizing:border-box}
body{margin:0;background:#16171d;font:400 16px/1.5 Inter,system-ui,sans-serif}
a,button{color:inherit;font-family:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bar{position:sticky;top:0;z-index:30;background:#0b0c10;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;text-align:center}
.bar span{display:block;font-size:12px;color:#9aa0b5;margin-bottom:6px}

.bar button[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.wrap{padding:10px 12px calc(env(safe-area-inset-bottom) + 10px)}
.fr{margin:0 auto;overflow-y:auto;overflow-x:hidden;container-type:inline-size;border-radius:10px;scrollbar-width:none;background:var(--bg)}.fr::-webkit-scrollbar{display:none}
.pg{color:var(--fg)}

.glow{position:absolute;left:50%;top:60%;width:min(115cqw,820px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--g) var(--ga,70%),transparent),transparent 72%);filter:blur(30px)}

.logo{font:700 18px Sora;letter-spacing:-.01em}.nl{display:none;gap:clamp(16px,2.4cqw,30px);font-size:14px;color:color-mix(in srgb,var(--fg) 72%,transparent)}.nl a:hover{color:var(--fg)}
.login{border:1px solid color-mix(in srgb,var(--fg) 30%,transparent);padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500}
.main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding-bottom:22px}
.tb{padding:14px 22px 0;max-width:640px;transition:opacity .4s,filter .4s}.tb.lv{opacity:0;filter:blur(10px)}
.eye{font:500 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--fg) 60%,transparent)}
h1{margin:10px 0 12px;font:800 clamp(34px,10.5cqw,86px)/.96 Sora;letter-spacing:-.035em;text-transform:uppercase}
.ln{display:block;overflow:hidden;padding-bottom:.06em}.ln span{display:block}
.tb.en .ln span{animation:up .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}@keyframes up{from{transform:translateY(105%)}}
.sub{font:600 17px Sora}.desc{color:color-mix(in srgb,var(--fg) 70%,transparent);max-width:410px;margin:6px 0 16px;font-size:15px;line-height:1.55}
.tb.en .sub,.tb.en .desc,.tb.en .bt{animation:fi .8s .25s both}@keyframes fi{from{opacity:0;transform:translateY(12px)}}
.bt{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.go{background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:6px;font-weight:600;font-size:14px}.sl{font-size:14px;color:color-mix(in srgb,var(--fg) 77%,transparent);border-bottom:1px solid color-mix(in srgb,var(--fg) 33%,transparent);padding-bottom:1px}
.stage{position:relative;flex:1;min-height:270px}
.cw{position:absolute;left:50%;top:50%;transition:transform .35s}.cw.dr{transition:none}
.fl{animation:bob 5s ease-in-out infinite}@keyframes bob{50%{translate:0 -10px}}
.bk{position:absolute;left:-66px;top:-94px;width:132px;height:188px;opacity:0;border-radius:4px 10px 10px 4px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 50%,#000) 0 8%,color-mix(in srgb,var(--c) 70%,#fff) 8.6%,var(--c) 14%,var(--c) 88%,color-mix(in srgb,var(--c) 70%,#000));box-shadow:0 28px 46px #000a,inset 0 0 0 1px #fff2}
.bk::before{content:"";position:absolute;right:-9px;top:5px;bottom:5px;width:11px;border-radius:0 5px 5px 0;background:repeating-linear-gradient(180deg,#f4f4f8 0 2px,#c3c3d0 2px 3px)}
.bk::after{content:"";position:absolute;right:14%;top:-1px;width:12px;height:42px;background:#fff;opacity:.9;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.lb{position:absolute;left:19%;right:9%;top:17%;bottom:13%;border:1px solid #ffffff6a;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;font:700 12px/1.15 Sora;letter-spacing:.04em;text-transform:uppercase;padding:4px}
.lb svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.lb small{font:500 7px Inter;letter-spacing:.22em;opacity:.85}
.bk.in{animation:drop 1s cubic-bezier(.3,1.35,.5,1) both}@keyframes drop{0%{opacity:0;transform:translateY(-190%) rotate(-24deg)}25%{opacity:1}100%{opacity:1;transform:rotate(6deg)}}
.bk.out{animation:outa .6s ease-in both}@keyframes outa{from{opacity:1;transform:rotate(6deg)}to{opacity:0;transform:translateY(60px) rotate(18deg) scale(.88);filter:blur(7px)}}
.dh{padding:48px 22px 0;max-width:900px;margin:auto}.dh h2{font:700 clamp(26px,5.5cqw,40px)/1.1 Sora;letter-spacing:-.02em;margin:0 0 8px}.dh p{color:color-mix(in srgb,var(--fg) 62%,transparent);margin:0;max-width:520px}
.blk{margin:36px 22px 0;padding-top:24px;border-top:1px solid color-mix(in srgb,var(--fg) 12%,transparent);max-width:900px}
.blk h3{display:flex;align-items:center;gap:10px;font:700 clamp(21px,4.5cqw,28px)/1.15 Sora;margin:0 0 6px;letter-spacing:-.01em}.blk h3::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.in2{color:color-mix(in srgb,var(--fg) 70%,transparent);margin:0 0 18px;max-width:560px}
.cols{display:grid;gap:22px}.cols h4{margin:0 0 10px;font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--fg) 50%,transparent)}
.ck,.sp{margin:0;padding:0;list-style:none;display:grid;gap:9px}.ck li,.sp li{font-size:15px;color:color-mix(in srgb,var(--fg) 85%,transparent);display:flex;gap:12px}
.ck li::before{content:"";flex:none;width:6px;height:6px;margin-top:9px;background:var(--c);border-radius:1px}
.sp{counter-reset:s}.sp li{counter-increment:s}.sp li::before{content:counter(s,decimal-leading-zero);flex:none;font:600 12px Sora;color:var(--c);margin-top:3px;min-width:20px}
.blk h4{margin:0 0 10px;font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--fg) 50%,transparent)}.hw{margin-top:18px;display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0 0 1px;color:var(--c);font:600 13px Inter;cursor:pointer;border-bottom:1px solid currentColor}.hw svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}.hw[aria-expanded="true"] svg{transform:rotate(180deg)}.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.xp>div{overflow:hidden}.xp.o{grid-template-rows:1fr}.xp .sp{padding-top:14px}.blk h3 a{display:inline-flex;align-items:center;gap:10px}.blk h3 a::after{content:"";width:8px;height:8px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);opacity:.55;transition:transform .2s,opacity .2s}.blk h3 a:hover::after{opacity:1;transform:translateX(4px) rotate(45deg)}.cw{cursor:pointer}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.ft{margin:50px 22px 0;border-top:1px solid color-mix(in srgb,var(--fg) 12%,transparent);padding:20px 0 40px;font-size:13px;color:color-mix(in srgb,var(--fg) 50%,transparent);max-width:900px}
@container (min-width:720px){nav{padding:22px clamp(24px,4.5cqw,56px) 0}.nl{display:flex}.main{flex-direction:row;align-items:center;padding-bottom:0}.tb{flex:0 0 52%;padding:0 0 0 56px}.stage{flex:1;height:100%}.glow{left:74%;top:50%}.bk{left:-95px;top:-135px;width:190px;height:270px}.lb{font-size:16px;gap:12px}.lb svg{width:52px;height:52px}.lb small{font-size:9px}.bk::before{width:14px;right:-12px}.dh{padding:64px 56px 0}.blk{margin:44px auto 0;width:calc(100% - 112px)}.ck{grid-template-columns:1fr 1fr;gap:9px 48px}.ft{margin:60px auto 0;width:calc(100% - 112px)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}.rv{opacity:1;transform:none}}

.bar .g{display:inline-block;margin:0 10px 4px}.bar span{display:inline;margin:0 6px 0 0}.bar div{display:inline}
.fr[data-t="1"]{--bg:#070C1B;--fg:#EEF2FF;--ga:62%}
.fr[data-t="2"]{--bg:#09120F;--fg:#ECF8F2;--ga:58%}
.fr[data-t="3"]{--bg:#F5F7FB;--fg:#0F1B33;--ga:34%}
.fr[data-t="4"]{--bg:#0E0E10;--fg:#F3EFE6;--ga:48%}
.fr[data-t="2"] .blk,.fr[data-t="3"] .blk{border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);border-radius:14px;padding:24px;margin-top:20px}
.fr[data-t="2"] .blk{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.fr[data-t="3"] .blk{background:#fff;box-shadow:0 1px 3px #0f1b3314}
.fr[data-t="3"] .bk{box-shadow:0 22px 34px #0f1b3355,inset 0 0 0 1px #fff2}
.fr[data-t="4"] h1,.fr[data-t="4"] h2,.fr[data-t="4"] .blk h3{font-family:Fraunces,Sora,serif;letter-spacing:-.02em}.fr[data-t="4"] h1{font-weight:700}.fr[data-t="4"] h2,.fr[data-t="4"] .blk h3{font-weight:600}
.fr[data-t="4"] .ck li{padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 10%,transparent)}
@container (min-width:720px){.fr[data-t="4"] .blk{display:grid;grid-template-columns:240px 1fr;column-gap:48px;align-items:start}.fr[data-t="4"] .blk h3{grid-column:1;grid-row:1}.fr[data-t="4"] .blk .in2{grid-column:1;grid-row:2/5}.fr[data-t="4"] .blk h4{grid-column:2;grid-row:1}.fr[data-t="4"] .blk .ck{grid-column:2;grid-row:2;grid-template-columns:1fr}.fr[data-t="4"] .blk .hw{grid-column:2;grid-row:3;justify-self:start}.fr[data-t="4"] .blk .xp{grid-column:2;grid-row:4}}
</style></head><body>
<div class="bar"><div class="g"><span>Screen</span><div id="dv"><button data-w="390">Mobile</button><button data-w="820">Tablet</button><button data-w="1280">Desktop</button></div></div></div>
<div class="wrap"><div class="fr" id="fr" data-t="3"><div class="pg">
<section class="hero" id="hero"><div class="glow"></div>
<nav><span class="logo">NEET Saathi</span><div class="nl"><a href="teacher.html">Ask Your Teacher</a><a href="test.html">Mock Test</a><a href="mistakes.html">Mistake Tracker</a><a href="plan.html">Daily Planner</a></div><a class="login" href="login.html">Log in</a></nav>
<div class="main"><div class="tb en" id="tb"></div><div class="stage"><div class="cw" id="cw"><div class="fl" id="fl"></div></div></div></div></section>
<section><div class="dh rv"><h2>Everything you need for NEET preparation</h2><p>A closer look at what each feature offers and how it works.</p></div><div id="bl"></div><div class="ft">NEET Saathi &nbsp;·&nbsp; Learn Smart. Achieve Your Dream.</div></section>
</div></div></div>
<script>
var D=[["ASK YOUR|TEACHER","Instant, step-by-step solutions.","Ask any Physics, Chemistry or Biology doubt by text, voice or photo and get a clear, structured explanation.","#2F6BFF","teacher","M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z","Ask a Question","Ask Your Teacher","Get clear, step-by-step answers to your doubts in Physics, Chemistry and Biology.",["Explanations supported by clear diagrams","Covers Physics, Chemistry and Biology","Optional subject selection","Ask by text, voice or photo","Upload an image or PDF of the question","Structured, step-by-step explanations","Chat history and previous conversations saved"],["Type, speak or upload your question","Receive a step-by-step explanation, with diagrams where helpful","Continue with follow-up questions","Return to any earlier chat from your history"]],
["MOCK|TEST","NEET-pattern practice tests.","Timed full-length and subject tests with instant scoring and detailed performance analysis.","#FF7A2F","test","M12 5a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 9v4l2.5 2","Take a Test","Mock Test","Practise in conditions that match the real examination.",["NEET-pattern question papers","Separate Physics, Chemistry and Biology sections","Countdown timer","Question navigation panel","Mark questions for review","Previous and next controls","Confirmation before submission"],["Select a test and begin","Answer the questions within the time limit","Review marked questions and submit","See your score, accuracy and subject-wise analysis instantly","Incorrect answers are saved to the Mistake Tracker"]],
["MISTAKE|TRACKER","Every mistake, tracked and revised.","Incorrect answers are saved automatically and reappear in future tests until you answer them correctly.","#FF3D8B","mistakes","M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4zM9 10l4 4m0-4-4 4","View Mistakes","Mistake Tracker","A record of every question you got wrong, designed so that you do not repeat the same error.",["Incorrect answers are saved automatically","Correct answer and explanation for each question","Organised by subject and topic","Repeated mistakes are flagged","Mark questions as reviewed","Revision and practice options"],["You answer a question incorrectly in a test","It is saved to your Mistake Tracker","Read the correct answer and explanation","Mark it as reviewed","The same question reappears in upcoming tests","Answer it correctly and it is removed from your list"]],
["WEAK|TOPICS","Know exactly where to improve.","Topic-level accuracy from your test performance, with targeted practice questions.","#19C37D","weak","M4 20V10m6 10V4m6 16v-7m4 7H2","View Weak Topics","Weak Topics","Identify exactly where you are losing marks.",["Weak topics identified from your test performance","Subject-wise weakness analysis","Accuracy and progress for every topic","Recommended practice questions","Improvement tracked over time"],["Complete one or more tests","Accuracy is calculated for each topic","Your weakest topics are listed first","Practise the recommended questions","Track your improvement over time"]],
["DAILY|PLANNER","A study plan built around you.","Daily targets, revision reminders and weekly progress reports in one place.","#8B5CF6","plan","M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM8 3v4m8-4v4M3 11h18","Open Planner","Daily Planner","A personalised schedule that keeps your preparation on track.",["Personalised daily study schedule","Daily study targets","Subject-wise tasks","Task completion tracking","Revision reminders","Daily and weekly progress reports"],["Review today's targets","Complete tasks and mark them as done","Receive reminders to revise","Check your daily report","Review your weekly progress"]],

["STUDENT|DASHBOARD","Your preparation at a glance.","Tests completed, accuracy, subject strengths and daily targets on a single screen.","#00B4D8","dashboard","M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z","Open Dashboard","Student Dashboard","A single view of your overall preparation.",["Total tests completed","Overall accuracy","Study progress","Strong and weak subjects","Recent test results","Today's study targets","Quick access to every feature"],["Log in to your account","Review your performance summary","Open any feature directly from the dashboard"]]];
var PAL={1:['#4F8CFF','#38BDF8','#818CF8','#2DD4BF','#A78BFA','#60A5FA'],2:['#34D399','#2DD4BF','#A3E635','#F59E0B','#22C55E','#38BDF8'],3:['#2563EB','#EA580C','#DB2777','#059669','#7C3AED','#0891B2'],4:['#C9A24A','#D08B5B','#B35C5C','#6FA58A','#7B8CC4','#A38BB8']};
var hero=document.getElementById('hero'),tb=document.getElementById('tb'),cw=document.getElementById('cw'),fl=document.getElementById('fl'),fr=document.getElementById('fr'),cur=0,tm,busy=0,th=3,io;
function col(i){return PAL[th][i]}
function build(){
fl.innerHTML=D.map(function(d,i){return '<div class="bk" style="--c:'+col(i)+'"><div class="lb"><svg viewBox="0 0 24 24"><path d="'+d[5]+'"/></svg><span>'+d[0].replace('|','<br>')+'</span><small>NEET SAATHI</small></div></div>'}).join('');
document.getElementById('bl').innerHTML=D.map(function(d,i){return '<div class="blk rv" style="--c:'+col(i)+'"><h3><a href="'+d[4]+'.html">'+d[7]+'</a></h3><p class="in2">'+d[8]+'</p><h4>Key features</h4><ul class="ck">'+d[9].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><button class="hw" aria-expanded="false">How it works<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="xp"><div><ol class="sp">'+d[10].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol></div></div></div>'}).join('');
if(io)io.disconnect();io=new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{root:fr,threshold:.1});[].forEach.call(document.querySelectorAll('.blk.rv,.dh.rv'),function(e){io.observe(e)})}
function txt(i){var d=D[i];tb.className='tb en';tb.innerHTML='<div class="eye">Start for free</div><h1>'+d[0].split('|').map(function(w,k){return '<span class="ln"><span style="--d:'+k*.12+'s">'+w+'</span></span>'}).join('')+'</h1><div class="sub">'+d[1]+'</div><p class="desc">'+d[2]+'</p><div class="bt"><a class="go" href="'+d[4]+'.html">'+d[6]+'</a></div>'}
function show(i,first){i=(i+D.length)%D.length;var b=fl.children,old=cur;if(!first){if(busy)return;busy=1;setTimeout(function(){busy=0},1000)}cur=i;hero.style.setProperty('--g',col(i));
if(first){txt(i);b[i].className='bk in';return}
tb.classList.add('lv');b[old].className='bk out';setTimeout(function(){txt(i)},380);setTimeout(function(){b[old].className='bk';b[i].className='bk in'},420)}
function auto(){clearInterval(tm);tm=setInterval(function(){show(cur+1)},5200)}
var x0=null,dx=0,mv=0;
hero.addEventListener('pointerdown',function(e){x0=e.clientX;dx=0;mv=0});
hero.addEventListener('pointermove',function(e){if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>10){mv=1;cw.classList.add('dr');cw.style.transform='translateX('+dx*.35+'px)'}});
function end(){if(x0===null)return;cw.classList.remove('dr');cw.style.transform='';if(Math.abs(dx)>50){show(cur+(dx<0?1:-1));auto()}x0=null}
hero.addEventListener('pointerup',end);hero.addEventListener('pointercancel',end);hero.addEventListener('pointerleave',end);
hero.addEventListener('click',function(e){if(mv){e.preventDefault();e.stopPropagation();mv=0}},true);
cw.onclick=function(){location.href=D[cur][4]+'.html'};
document.getElementById('bl').onclick=function(e){var b=e.target.closest('.hw');if(!b)return;var o=b.nextElementSibling.classList.toggle('o');b.setAttribute('aria-expanded',o)};
var cwid=innerWidth<700?390:innerWidth<1100?820:1280;
function marks(){document.querySelectorAll('#dv button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.w==cwid)});document.querySelectorAll('#ds button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t==th)})}
function fit(){var z=Math.min(1,(innerWidth-24)/cwid),h=(innerHeight-document.querySelector('.bar').offsetHeight-24)/z;fr.style.width=cwid+'px';fr.style.zoom=z;fr.style.height=h+'px';fr.style.setProperty('--fh',h+'px');marks()}
document.getElementById('dv').onclick=function(e){if(e.target.dataset.w){cwid=+e.target.dataset.w;fit();fr.scrollTop=0}};

addEventListener('resize',fit);build();fit();show(0,1);auto();
</script></body></html>

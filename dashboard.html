<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Student Dashboard · NEET Saathi</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--bg:#F5F7FB;--fg:#0F1B33;--mu:#5B6785;--ln:#E2E7F0;--ac:#0891B2;--ok:#16A34A;--no:#DC2626;--am:#D97706}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Inter,system-ui,sans-serif}
a,button{color:inherit;font-family:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.nv{height:57px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid var(--ln)}
.logo{font:700 18px Sora;letter-spacing:-.01em}.nl{display:none;gap:26px;font-size:14px;color:var(--mu)}.nl a:hover,.nl a.on{color:var(--fg)}.nl a.on{font-weight:600}
.login{border:1px solid var(--ln);padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500}
.w{max-width:1000px;margin:0 auto;padding:24px 16px 70px}
h1{font:800 clamp(26px,5vw,36px)/1.1 Sora;letter-spacing:-.02em;margin:0 0 6px}h2{font:700 18px Sora;margin:0}
.mu{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.stats div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;box-shadow:0 1px 3px #0f1b3314}.stats b{display:block;font:800 26px Sora}.stats span{font-size:13px;color:var(--mu)}
.cd{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0f1b3314}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.hd a{font:600 13px Inter;color:var(--ac);border-bottom:1px solid currentColor}
.bar{height:8px;background:#E8EDF6;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.bg{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:8px 14px;font:500 14px Inter;cursor:pointer;display:inline-block}.bg:hover{border-color:var(--fg)}
.bt{background:var(--fg);color:#fff;border:1px solid var(--fg);border-radius:6px;padding:9px 16px;font:600 14px Inter;cursor:pointer;display:inline-block}
.row2{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.tag{font:600 12px Inter;border-radius:5px;padding:2px 8px;background:#EEF2FA;white-space:nowrap}.tag.r{background:#FEE2E2;color:#991B1B}.tag.a{background:#FEF3C7;color:#92400E}.tag.g{background:#DCFCE7;color:#166534}
.tk{display:flex;align-items:center;gap:12px;padding:9px 2px;border-top:1px solid var(--ln)}.tk:first-of-type{border-top:0}
.ckb{flex:none;width:26px;height:26px;border:2px solid #AEB8D0;border-radius:7px;background:#fff;cursor:pointer;position:relative}
.ckb[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}.ckb[aria-pressed="true"]::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.tx{flex:1;min-width:0}.tx small{color:var(--mu);display:block}.tk.dn .tx span{text-decoration:line-through;color:var(--mu)}
.sb{margin-bottom:12px}.sb:last-child{margin-bottom:0}.sb small{color:var(--mu)}
.rs{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--ln)}.rs:first-of-type{border-top:0}.rs small{color:var(--mu)}.rs .pc{grid-row:1/3;grid-column:2;text-align:right;font:800 20px Sora;align-self:center}.rs .pc small{display:block;font:500 12px Inter}
.rv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.rv:first-of-type{border-top:0}.rv small{color:var(--mu);display:block}
.ql{display:grid;grid-template-columns:1fr;gap:10px}.ql a{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px 16px;display:block;box-shadow:0 1px 3px #0f1b3314}.ql a:hover{border-color:var(--fg)}.ql b{font:700 16px Sora;display:flex;align-items:center;gap:8px}.ql b::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}.ql span{font-size:14px;color:var(--mu)}
.note{background:#EEF4FF;border:1px solid #C7D8FB;border-radius:10px;padding:14px 16px;margin:16px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.g2{display:grid;gap:14px}.sp svg{display:block;width:100%;height:auto}
@media(min-width:720px){.nl{display:flex}.nv{padding:0 40px}.stats{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.ql{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header class="nv"><a class="logo" href="index.html">NEET Saathi</a><div class="nl"><a href="teacher.html">Ask Your Teacher</a><a href="test.html">Mock Test</a><a href="mistakes.html">Mistake Tracker</a><a href="plan.html">Daily Planner</a></div><a class="login" href="login.html">Log in</a></header>
<main class="w">
<h1>Student Dashboard</h1><p class="mu" style="margin:0" id="dt"></p>
<div id="body"></div>
</main>
<script>
const SK=['Physics','Chemistry','Biology'],$=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=key(new Date());
const mins=a=>a.reduce((s,x)=>s+x.m,0),fmt=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+'h ':'')+((r||!h)?r+'m':'')};
const col=a=>a<50?'var(--no)':a<75?'var(--am)':'var(--ok)',lab=a=>a<50?['r','Weak']:a<75?['a','Needs work']:['g','Strong'];
function stat(P,dk){const p=P[dk];if(!p||!p.t.length)return null;const d=p.t.filter(x=>x.d);return{tot:p.t.length,dn:d.length,dm:mins(d),pc:Math.round(d.length/p.t.length*100)}}
function render(){const tests=load('neet_saathi_tests',[]),M=load('neet_saathi_mistakes',{}),pr=load('neet_saathi_practice',{}),P=load('neet_saathi_plan',{}),S=Object.assign({hours:6},load('neet_saathi_plan_set',{}));
const hr=new Date().getHours();$('dt').textContent=(hr<12?'Good morning':hr<17?'Good afternoon':'Good evening')+'. Here is your preparation at a glance.';
/* subjects and topics */
const sub={};SK.forEach(s=>sub[s]={c:0,t:0});const T={};
tests.forEach(t=>{SK.forEach(s=>{const x=(t.subs||{})[s];if(x){sub[s].c+=x.c;sub[s].t+=x.c+x.w}});Object.keys(t.topics||{}).forEach(k=>{const x=t.topics[k],o=T[k]=T[k]||{n:k,s:x.s,c:0,t:0};o.c+=x.c;o.t+=x.t})});
Object.keys(pr).forEach(k=>{if(T[k]){T[k].c+=pr[k].c;T[k].t+=pr[k].t}});
const WT=Object.values(T).filter(x=>x.t).map(x=>({...x,a:Math.round(x.c/x.t*100)})).sort((a,b)=>a.a-b.a);
const tc=SK.reduce((a,s)=>a+sub[s].c,0),ta=SK.reduce((a,s)=>a+sub[s].t,0),acc=ta?Math.round(tc/ta*100):0;
/* planner */
const d0=new Date();d0.setDate(d0.getDate()-((d0.getDay()+6)%7));const wk=[];for(let i=0;i<7;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);wk.push(stat(P,key(d)))}const wd=wk.filter(Boolean);
const wp=wd.length?Math.round(wd.reduce((a,x)=>a+x.pc,0)/wd.length):0,wm=wd.reduce((a,x)=>a+x.dm,0);
let st=0,dd=new Date();for(let i=0;i<60;i++){const s=stat(P,key(dd));if(s&&s.pc>=80)st++;else if(i>0)break;dd.setDate(dd.getDate()-1)}
const tp=P[today],ts=stat(P,today),tg=S.hours*60,tdm=ts?ts.dm:0,mc=Object.values(M).filter(m=>!m.reviewed).length;
let h='';
if(!tests.length)h+='<div class="note"><span><b>Start here.</b> Take your first mock test. Your accuracy, strong and weak subjects and recent results will appear on this dashboard.</span><a class="bt" href="test.html">Take a mock test</a></div>';
h+='<div class="stats"><div><b>'+tests.length+'</b><span>Tests completed</span></div><div><b>'+(ta?acc+'%':'–')+'</b><span>Overall accuracy</span></div><div><b>'+wp+'%</b><span>Study progress this week</span></div><div><b>'+st+'</b><span>Day streak</span></div></div>';
/* today + progress */
h+='<div class="g2"><div class="cd"><div class="hd"><h2>Today’s study targets</h2><a href="plan.html">Open planner</a></div><div class="row2"><span>'+fmt(tdm)+' of '+fmt(tg)+'</span><span>'+Math.min(100,Math.round(tdm/tg*100))+'%</span></div><div class="bar"><i style="width:'+Math.min(100,tdm/tg*100)+'%"></i></div><div style="margin-top:10px">'+(tp&&tp.t.length?tp.t.slice(0,5).map(x=>'<div class="tk'+(x.d?' dn':'')+'"><button class="ckb" data-t="'+x.id+'" aria-pressed="'+(x.d?'true':'false')+'" aria-label="Mark as done"></button><div class="tx"><span>'+esc(x.x)+'</span><small>'+x.s+' · '+fmt(x.m)+'</small></div></div>').join('')+(tp.t.length>5?'<p class="mu" style="margin:8px 0 0;font-size:14px">+ '+(tp.t.length-5)+' more tasks in your planner.</p>':''):'<p class="mu" style="margin:6px 0 10px">No plan for today yet.</p><a class="bg" href="plan.html">Create today’s plan</a>')+'</div></div>';
h+='<div class="cd"><div class="hd"><h2>Study progress</h2><a href="plan.html">Weekly report</a></div><div class="sb"><div class="row2"><span>Tasks completed this week</span><span>'+wp+'%</span></div><div class="bar"><i style="width:'+wp+'%"></i></div></div><div class="sb"><div class="row2"><span>Time studied this week</span><span>'+fmt(wm)+'</span></div><small>Daily target: '+fmt(tg)+'</small></div><div class="sb"><div class="row2"><span>Mistakes waiting for review</span><span>'+mc+'</span></div><small><a href="mistakes.html" style="text-decoration:underline">Open Mistake Tracker</a></small></div></div></div>';
/* subjects */
const sd=SK.filter(s=>sub[s].t).map(s=>({s:s,a:Math.round(sub[s].c/sub[s].t*100)})).sort((a,b)=>b.a-a.a);
h+='<div class="g2"><div class="cd"><div class="hd"><h2>Strong and weak subjects</h2></div>'+(sd.length?SK.map(s=>{const x=sd.find(z=>z.s===s);if(!x)return '<div class="sb"><div class="row2"><span>'+s+'</span><span class="mu">No data</span></div></div>';const l=lab(x.a);return '<div class="sb"><div class="row2"><span>'+s+' <span class="tag '+l[0]+'">'+(sd.length>1&&x===sd[0]?'Strongest':sd.length>1&&x===sd[sd.length-1]?'Weakest':l[1])+'</span></span><span>'+x.a+'%</span></div><div class="bar"><i style="width:'+x.a+'%;background:'+col(x.a)+'"></i></div></div>'}).join(''):'<p class="mu" style="margin:0">Subject strengths appear after your first mock test.</p>')+'</div>';
h+='<div class="cd"><div class="hd"><h2>Weakest topics</h2><a href="weak.html">View all</a></div>'+(WT.length?WT.slice(0,4).map(x=>{const l=lab(x.a);return '<div class="rv"><div>'+esc(x.n)+'<small>'+x.s+' · '+x.c+' of '+x.t+' correct</small></div><span class="tag '+l[0]+'">'+x.a+'%</span></div>'}).join(''):'<p class="mu" style="margin:0">Weak topics are identified automatically from your test performance.</p>')+'</div></div>';
/* recent results */
const rc=tests.slice(-5).reverse();
h+='<div class="cd"><div class="hd"><h2>Recent test results</h2><a href="test.html">Take a test</a></div>'+(rc.length?rc.map(t=>'<div class="rs"><span><b>'+esc(t.title)+'</b></span><div class="pc" style="color:'+col(t.acc)+'">'+t.acc+'%<small class="mu">accuracy</small></div><small>'+new Date(t.d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · Score '+t.sc+' / '+t.max+'</small></div>').join(''):'<p class="mu" style="margin:0">No tests yet.</p>')+'</div>';
if(tests.length>1){const n=tests.slice(-10),W=420,H=110,Q=n.map((t,i)=>[20+i*(W-40)/Math.max(1,n.length-1),H-18-t.acc*(H-36)/100,t.acc]);
h+='<div class="cd sp"><div class="hd"><h2>Accuracy trend</h2></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Accuracy across tests"><line x1="20" y1="'+(H-18)+'" x2="'+(W-20)+'" y2="'+(H-18)+'" stroke="#E2E7F0"/><polyline fill="none" stroke="#0891B2" stroke-width="2.5" points="'+Q.map(p=>p[0]+','+p[1]).join(' ')+'"/>'+Q.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#0891B2"/><text x="'+p[0]+'" y="'+(p[1]-8)+'" font-size="10" text-anchor="middle" fill="#0F1B33" font-family="Inter">'+p[2]+'%</text>').join('')+'</svg></div>'}
/* quick access */
h+='<div class="hd" style="margin-top:22px"><h2>Quick access</h2></div><div class="ql">'+[['Ask Your Teacher','Get a step-by-step explanation for any doubt','teacher','#2563EB'],['Mock Test','Take a timed NEET-pattern test','test','#EA580C'],['Mistake Tracker','Review the questions you got wrong','mistakes','#DB2777'],['Weak Topics','See where you are losing marks','weak','#059669'],['Daily Planner','Today’s targets and revision reminders','plan','#7C3AED']].map(x=>'<a href="'+x[2]+'.html" style="--c:'+x[3]+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></a>').join('')+'</div>';
$('body').innerHTML=h}
$('body').onclick=e=>{const b=e.target.closest('.ckb');if(!b)return;const P=load('neet_saathi_plan',{}),p=P[today],x=p&&p.t.find(z=>z.id===+b.dataset.t);if(x){x.d=x.d?0:1;put('neet_saathi_plan',P);render()}};
addEventListener('storage',render);render();
</script></body></html>

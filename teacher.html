<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ask Your Teacher · NEET Saathi</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="sync.js"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#F5F7FB;--fg:#0F1B33;--mu:#5B6785;--ln:#E2E7F0;--ac:#2563EB}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
a,button{color:inherit;font-family:inherit;text-decoration:none}a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.nv{height:57px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid var(--ln)}
.logo{font:700 18px Sora;letter-spacing:-.01em}.nl{display:none;gap:26px;font-size:14px;color:var(--mu)}.nl a:hover,.nl a.on{color:var(--fg)}.nl a.on{font-weight:600}
.login{border:1px solid var(--ln);padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500}
.app{display:grid;grid-template-columns:1fr;height:calc(100vh - 57px);height:calc(100dvh - 57px);position:relative}
aside{position:absolute;inset:0 auto 0 0;width:min(300px,86vw);background:#fff;border-right:1px solid var(--ln);transform:translateX(-100%);transition:transform .3s;z-index:20;display:flex;flex-direction:column;padding:14px}
aside.open{transform:none;box-shadow:0 0 0 100vmax #0f1b3355}
.nw{border:1px solid var(--fg);background:var(--fg);color:#fff;border-radius:6px;padding:9px 12px;font:600 14px Inter;cursor:pointer;margin-bottom:14px}
.hl{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:0 0 8px}
#hist{overflow-y:auto;display:grid;gap:2px;align-content:start}
.hi{display:flex;align-items:center;gap:6px;border-radius:6px}.hi.on{background:#EEF2FA}
.hi button.t{flex:1;text-align:left;background:none;border:0;padding:9px 10px;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi button.x{background:none;border:0;color:var(--mu);cursor:pointer;padding:6px 10px;font-size:16px}
.chat{display:flex;flex-direction:column;min-height:0}
.top2{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--ln);background:#fff;flex-wrap:wrap}
.txt{background:none;border:1px solid var(--ln);border-radius:6px;padding:5px 12px;font:500 13px Inter;cursor:pointer}
.ch{border:1px solid var(--ln);background:#fff;border-radius:6px;padding:5px 12px;font:500 13px Inter;cursor:pointer}.ch.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.sl{font-size:12px;color:var(--mu);margin-right:2px}
#msgs{flex:1;overflow-y:auto;padding:18px 16px}
.row{max-width:760px;margin:0 auto 18px}
.u{margin-left:auto;background:var(--fg);color:#fff;padding:10px 14px;border-radius:12px 12px 2px 12px;width:fit-content;max-width:88%;white-space:pre-wrap;word-break:break-word}
.u small{display:block;opacity:.7;font-size:12px;margin-top:4px}
.a{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:16px;box-shadow:0 1px 3px #0f1b3314}
.who{font:700 12px Sora;color:var(--ac);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.a p{margin:0 0 6px;white-space:pre-wrap}
.stps{list-style:none;margin:10px 0;padding:0;display:grid;gap:12px;counter-reset:s}
.stps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.stps li::before{content:counter(s);width:24px;height:24px;border-radius:6px;background:#E8EFFE;color:var(--ac);font:700 12px/24px Sora;text-align:center}
.stps b{display:block;font-weight:600}.stps span{color:var(--mu);font-size:15px;white-space:pre-wrap}
.dg{margin:12px 0 0;border:1px solid var(--ln);border-radius:10px;padding:10px;background:#FAFBFE}.dg svg{width:100%;height:auto;display:block;max-height:340px}.dg figcaption{font-size:13px;color:var(--mu);margin-top:6px}
.fu{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.fu button{background:#EEF2FA;border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left}
.dm{font-size:12px;color:var(--mu);margin-top:10px;border-top:1px solid var(--ln);padding-top:8px}
.ty{display:flex;gap:5px;padding:4px 0}.ty i{width:7px;height:7px;border-radius:50%;background:var(--ac);opacity:.35;animation:bl 1.1s infinite}.ty i:nth-child(2){animation-delay:.18s}.ty i:nth-child(3){animation-delay:.36s}@keyframes bl{50%{opacity:1;transform:translateY(-3px)}}
.em{max-width:560px;margin:7vh auto 0;text-align:center}.em h1{margin:0 0 8px;font:800 clamp(26px,6vw,38px)/1.1 Sora;letter-spacing:-.02em}.em p{color:var(--mu);margin:0 0 20px}
.sg{display:grid;gap:8px}.sg button{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:11px 14px;text-align:left;font-size:15px;cursor:pointer}.sg button:hover{border-color:var(--ac)}
.comp{padding:8px 16px calc(env(safe-area-inset-bottom) + 12px)}
.cbox{max-width:760px;margin:auto;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:8px;box-shadow:0 2px 10px #0f1b3314;position:relative}
textarea{width:100%;border:0;resize:none;font:inherit;outline:0;max-height:140px;padding:6px 8px;background:none;color:inherit}
.tools{display:flex;gap:6px;align-items:center;padding-top:4px}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid var(--ln);background:#fff;display:grid;place-items:center;cursor:pointer}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:#FEE2E2;border-color:#F87171;color:#B91C1C}
.send{margin-left:auto;background:var(--fg);color:#fff;border-color:var(--fg)}
.menu{position:absolute;bottom:58px;left:8px;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:6px;min-width:200px;display:none;box-shadow:0 8px 24px #0f1b3326;z-index:5}.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;font-size:14px;cursor:pointer}.menu button:hover{background:#EEF2FA}
.att{display:flex;gap:8px;flex-wrap:wrap;padding:4px 6px}.att span{background:#EEF2FA;border-radius:6px;padding:3px 8px;font-size:13px;display:flex;align-items:center;gap:6px;max-width:100%}.att i{cursor:pointer;font-style:normal;color:var(--mu)}
.hint{max-width:760px;margin:6px auto 0;font-size:12px;color:var(--mu);text-align:center}
@media(min-width:900px){.nl{display:flex}.nv{padding:0 40px}.app{grid-template-columns:290px 1fr}aside{position:static;transform:none;box-shadow:none!important}#menu{display:none}}
@media(prefers-reduced-motion:reduce){.ty i{animation:none}aside{transition:none}}
</style></head><body>
<header class="nv"><a class="logo" href="index.html">NEET Saathi</a><div class="nl"><a class="on" href="teacher.html">Ask Your Teacher</a><a href="test.html">Mock Test</a><a href="mistakes.html">Mistake Tracker</a><a href="plan.html">Daily Planner</a></div><a class="login" href="login.html">Log in</a></header>
<div class="app">
<aside id="side"><button class="nw" id="new">New conversation</button><p class="hl">Previous conversations</p><div id="hist"></div></aside>
<main class="chat">
<div class="top2"><button class="txt" id="menu">History</button><span class="sl">Subject (optional)</span><div id="subj"><button class="ch on" data-s="">All</button> <button class="ch" data-s="Physics">Physics</button> <button class="ch" data-s="Chemistry">Chemistry</button> <button class="ch" data-s="Biology">Biology</button></div></div>
<div id="msgs"></div>
<div class="comp"><div class="cbox">
<div class="menu" id="am"><button id="pho">Take a photo</button><button id="upl">Upload image or PDF</button></div>
<div class="att" id="att"></div>
<textarea id="ta" rows="1" placeholder="Type your question, or use the microphone"></textarea>
<div class="tools">
<button class="ib" id="atb" aria-label="Attach"><svg viewBox="0 0 24 24"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></button>
<button class="ib" id="mic" aria-label="Voice input"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button class="ib send" id="snd" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
</div></div><div class="hint" id="hint"></div></div>
</main></div>
<input type="file" id="fp" accept="image/*" capture="environment" hidden>
<input type="file" id="fu" accept="image/*,application/pdf" multiple hidden>
<script>
var C=window.NEET_CONFIG||{},sb=(C.url&&C.key&&window.supabase)?supabase.createClient(C.url,C.key):null;
/* Real answers come from your Supabase function. Without a backend the page shows a demo answer. */
var API_URL=sb?C.url.replace(/\/$/,'')+'/functions/v1/dynamic-service':'';
var K='neet_saathi_chats',chats=[],cur=null,subj='',files=[],rec=null,busy=0;
try{chats=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){chats=[]}
var $=function(i){return document.getElementById(i)},msgs=$('msgs'),ta=$('ta');
function save(){try{localStorage.setItem(K,JSON.stringify(chats))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function get(){return chats.filter(function(c){return c.id===cur})[0]}
/* Safe SVG: only simple drawing elements and attributes are kept */
var OKT={svg:1,g:1,rect:1,circle:1,ellipse:1,line:1,path:1,polygon:1,polyline:1,text:1,tspan:1};
var OKA=/^(viewBox|x|y|x1|x2|y1|y2|cx|cy|r|rx|ry|width|height|d|points|fill|stroke|stroke-width|stroke-linecap|stroke-linejoin|stroke-dasharray|opacity|fill-opacity|stroke-opacity|transform|font-size|font-family|font-weight|text-anchor|dominant-baseline|dx|dy)$/;
function clean(n){[].slice.call(n.childNodes).forEach(function(c){if(c.nodeType===1){if(!OKT[c.localName]){c.remove();return}[].slice.call(c.attributes).forEach(function(a){if(!OKA.test(a.name)||/url\(|javascript|data:|<|&#/i.test(a.value))c.removeAttribute(a.name)});clean(c)}else if(c.nodeType!==3)c.remove()})}
function safeSvg(s){try{if(typeof s!=='string'||s.length>12000||!/^\s*<svg/i.test(s))return '';var d=new DOMParser().parseFromString(s,'image/svg+xml'),r=d.documentElement;if(!r||r.localName!=='svg'||d.querySelector('parsererror'))return '';var vb=r.getAttribute('viewBox');[].slice.call(r.attributes).forEach(function(a){r.removeAttribute(a.name)});r.setAttribute('viewBox',/^[\d\s.\-]+$/.test(vb||'')?vb:'0 0 420 220');r.setAttribute('xmlns','http://www.w3.org/2000/svg');clean(r);return new XMLSerializer().serializeToString(r)}catch(e){return ''}}
var SAMPLES=['Why does a nerve impulse jump between nodes of Ranvier?','Derive the relation between the focal length and radius of curvature of a mirror.','Why is the boiling point of water higher than that of H2S?'];
var DIAG='<svg viewBox="0 0 420 120"><line x1="10" y1="60" x2="410" y2="60" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/><g fill="#2563EB" opacity=".85"><rect x="30" y="38" width="90" height="44" rx="14"/><rect x="140" y="38" width="90" height="44" rx="14"/><rect x="250" y="38" width="90" height="44" rx="14"/></g><g fill="#0F1B33" font-family="Inter,sans-serif" font-size="11" text-anchor="middle"><text x="75" y="104">Myelin sheath</text><text x="130" y="22">Node</text><text x="240" y="22">Node</text><text x="350" y="22">Node</text></g></svg>';
var DEMO={summary:'The impulse jumps from one node of Ranvier to the next. This is called saltatory conduction.',steps:[{title:'Myelin acts as an insulator',text:'The myelin sheath prevents ions from crossing the membrane along most of the axon.'},{title:'Ion exchange happens only at the nodes',text:'Voltage-gated channels are concentrated at the nodes of Ranvier, so depolarisation occurs only there.'},{title:'The signal jumps ahead',text:'Current flows through the axoplasm to the next node, which depolarises and fires in turn.'},{title:'Result: faster conduction',text:'Skipping the myelinated stretches makes conduction much faster and saves energy.'}],diagram:DIAG,caption:'Saltatory conduction along a myelinated axon',fu:['Explain with a numerical example','Compare with a non-myelinated axon'],demo:1};
function title(t){return t.length>42?t.slice(0,42)+'…':t}
function renderHist(){var h=$('hist');if(!chats.length){h.innerHTML='<p style="color:#5B6785;font-size:14px;padding:4px 10px">No conversations yet.</p>';return}
h.innerHTML=chats.slice().sort(function(a,b){return b.u-a.u}).map(function(c){return '<div class="hi'+(c.id===cur?' on':'')+'"><button class="t" data-o="'+c.id+'">'+esc(c.t)+'</button><button class="x" data-d="'+c.id+'" aria-label="Delete conversation">×</button></div>'}).join('')}
function ans(d){var s='<div class="row"><div class="a"><div class="who">Teacher</div>';
if(d.summary)s+='<p>'+esc(d.summary)+'</p>';
if(d.steps&&d.steps.length)s+='<ol class="stps">'+d.steps.map(function(x){return '<li><div><b>'+esc(x.title)+'</b><span>'+esc(x.text)+'</span></div></li>'}).join('')+'</ol>';
var g=safeSvg(d.diagram);if(g)s+='<figure class="dg" role="img" aria-label="'+esc(d.caption||'Diagram')+'">'+g+'<figcaption>'+esc(d.caption||'Diagram')+'</figcaption></figure>';
if(d.fu&&d.fu.length)s+='<div class="fu">'+d.fu.map(function(f){return '<button data-q="'+esc(f)+'">'+esc(f)+'</button>'}).join('')+'</div>';
if(d.demo)s+='<div class="dm">Sample response (demo mode). Connect your backend to get answers to your own questions.</div>';
return s+'</div></div>'}
function renderMsgs(){var c=get();
if(!c||!c.m.length){msgs.innerHTML='<div class="em"><h1>What would you like to understand today?</h1><p>Ask any Physics, Chemistry or Biology doubt. You will get a clear, step-by-step explanation.</p><div class="sg">'+SAMPLES.map(function(q){return '<button data-q="'+esc(q)+'">'+esc(q)+'</button>'}).join('')+'</div></div>';return}
msgs.innerHTML=c.m.map(function(m){return m.r==='u'?'<div class="row"><div class="u">'+esc(m.t)+(m.a&&m.a.length?'<small>Attached: '+esc(m.a.join(', '))+'</small>':'')+'</div></div>':ans(m.d)}).join('')+(busy?'<div class="row"><div class="a"><div class="who">Teacher</div><div class="ty"><i></i><i></i><i></i></div></div></div>':'');
msgs.scrollTop=msgs.scrollHeight}
function ensure(t){if(!get()){var c={id:'c'+Date.now(),t:title(t||'New conversation'),m:[],u:Date.now()};chats.push(c);cur=c.id}return get()}
function hist(c){return c.m.slice(0,-1).slice(-8).map(function(m){return m.r==='u'?{role:'user',text:m.t}:{role:'teacher',text:(m.d.summary||'')+' '+((m.d.steps||[]).map(function(s){return s.title+': '+s.text}).join(' '))}})}
async function ask(q,c){
if(!API_URL)return new Promise(function(r){setTimeout(function(){r(DEMO)},1000)});
var s=await sb.auth.getSession(),tok=s.data&&s.data.session&&s.data.session.access_token;if(!tok)throw {code:401};
var fd=new FormData();fd.append('question',q);fd.append('subject',subj);fd.append('history',JSON.stringify(hist(c)));files.forEach(function(f){fd.append('files',f)});
var r=await fetch(API_URL,{method:'POST',headers:{Authorization:'Bearer '+tok,apikey:C.key},body:fd});
if(!r.ok)throw {code:r.status};return r.json()}
function errMsg(e){var k=e&&e.code;
if(k===429)return 'You have reached today’s question limit. Please come back tomorrow.';
if(k===401)return 'Your session has expired. Please log in again.';
if(k===413)return 'The attached files are too large. Please attach smaller files.';
if(k===500||k===502)return 'The teacher is not available right now. Please try again in a moment.';
return 'Something went wrong while getting the answer. Please check your connection and try again.'}
function send(text){if(busy)return;var q=(text!=null?text:ta.value).trim();if(!q&&!files.length)return;if(!q)q='Please explain the attached question.';
var c=ensure(q),names=files.map(function(f){return f.name});c.m.push({r:'u',t:q,a:names});c.u=Date.now();
ta.value='';grow();busy=1;renderMsgs();renderHist();save();
var done=function(d){busy=0;c.m.push({r:'a',d:d});c.u=Date.now();files=[];attach();save();renderMsgs();renderHist()};
ask(q,c).then(done).catch(function(e){done({summary:errMsg(e),steps:[]})})}
function grow(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px'}
function attach(){$('att').innerHTML=files.map(function(f,i){return '<span>'+esc(f.name)+'<i data-r="'+i+'" role="button" aria-label="Remove">×</i></span>'}).join('')}
function addFiles(l){[].forEach.call(l,function(f){if(files.length<4&&f.size<10485760)files.push(f)});attach();$('am').classList.remove('open')}
$('snd').onclick=function(){send()};
ta.addEventListener('input',grow);
ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&innerWidth>=900){e.preventDefault();send()}});
$('atb').onclick=function(){$('am').classList.toggle('open')};
$('pho').onclick=function(){$('fp').click()};$('upl').onclick=function(){$('fu').click()};
$('fp').onchange=function(e){addFiles(e.target.files);e.target.value=''};$('fu').onchange=function(e){addFiles(e.target.files);e.target.value=''};
$('att').onclick=function(e){var r=e.target.dataset.r;if(r!=null){files.splice(+r,1);attach()}};
document.addEventListener('click',function(e){if(!e.target.closest('#am,#atb'))$('am').classList.remove('open')});
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=function(){var b=$('mic');if(!SR){alert('Voice input is not supported in this browser. Please try Chrome.');return}if(rec){rec.stop();return}
rec=new SR();rec.lang='en-IN';rec.interimResults=true;var base=ta.value;
rec.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;ta.value=(base+' '+s).trim();grow()};
rec.onend=function(){rec=null;b.classList.remove('on')};rec.onerror=function(){rec=null;b.classList.remove('on')};rec.start();b.classList.add('on')};
$('subj').onclick=function(e){var s=e.target.dataset.s;if(s==null)return;subj=s;[].forEach.call($('subj').children,function(b){b.classList.toggle('on',b.dataset.s===s)});$('hint').textContent=s?'Answering as a '+s+' question.':''};
$('new').onclick=function(){cur=null;renderMsgs();renderHist();$('side').classList.remove('open')};
$('menu').onclick=function(){$('side').classList.add('open')};
document.addEventListener('click',function(e){var s=$('side');if(s.classList.contains('open')&&!e.target.closest('#side,#menu'))s.classList.remove('open')});
$('hist').onclick=function(e){var o=e.target.dataset.o,d=e.target.dataset.d;if(o){cur=o;renderMsgs();renderHist();$('side').classList.remove('open')}
if(d){chats=chats.filter(function(c){return c.id!==d});if(cur===d)cur=null;save();renderMsgs();renderHist()}};
msgs.onclick=function(e){var q=e.target.dataset.q;if(q)send(q)};
renderHist();renderMsgs();
</script></body></html>

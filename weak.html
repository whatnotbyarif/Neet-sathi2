<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weak Topics · NEET Saathi</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--bg:#F5F7FB;--fg:#0F1B33;--mu:#5B6785;--ln:#E2E7F0;--ac:#059669;--ok:#16A34A;--no:#DC2626;--am:#D97706}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Inter,system-ui,sans-serif}
a,button{color:inherit;font-family:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.nv{height:57px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid var(--ln)}
.logo{font:700 18px Sora;letter-spacing:-.01em}.nl{display:none;gap:26px;font-size:14px;color:var(--mu)}.nl a:hover,.nl a.on{color:var(--fg)}.nl a.on{font-weight:600}
.login{border:1px solid var(--ln);padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500}
.w{max-width:960px;margin:0 auto;padding:24px 16px 70px}
h1{font:800 clamp(26px,5vw,36px)/1.1 Sora;letter-spacing:-.02em;margin:0 0 6px}h2{font:700 18px Sora;margin:0 0 12px}
.mu{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.stats div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;box-shadow:0 1px 3px #0f1b3314}.stats b{display:block;font:800 26px Sora}.stats span{font-size:13px;color:var(--mu)}
.how{background:#fff;border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:15px;color:#33415f}
.cd{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0f1b3314}
.fb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.fb .l{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-right:4px}
.bg{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:8px 14px;font:500 14px Inter;cursor:pointer}.bg:hover{border-color:var(--fg)}.bg.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.bt{background:var(--fg);color:#fff;border:1px solid var(--fg);border-radius:6px;padding:9px 16px;font:600 14px Inter;cursor:pointer}.bt:disabled{opacity:.4;cursor:default}
.pr{background:var(--ac);border-color:var(--ac)}
.rw{padding:12px 0;border-top:1px solid var(--ln)}.rw:first-of-type{border-top:0}.r1{display:flex;justify-content:space-between;gap:10px;font-weight:600}.rw small{color:var(--mu)}
.bar{height:8px;background:#E8EDF6;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:6px}
.qh{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.tag{font:600 12px Inter;border-radius:5px;padding:2px 8px;background:#EEF2FA}
.tag.r{background:#FEE2E2;color:#991B1B}.tag.a{background:#FEF3C7;color:#92400E}.tag.g{background:#DCFCE7;color:#166534}
.tn{font:700 17px Sora;margin:0}.pc{font:800 24px Sora}
.tr{font:600 13px Inter}.tr.u{color:var(--ok)}.tr.d{color:var(--no)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ac .bg{padding:7px 12px;font-size:13px}
.ch svg{display:block;width:100%;height:auto}
.em{text-align:center;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:40px 18px;margin-top:20px}.em h2{margin-bottom:6px}.em p{margin:0 0 16px;color:var(--mu)}
.md{position:fixed;inset:0;background:#0f1b3380;display:grid;place-items:center;padding:14px;z-index:50}.mb{background:#fff;border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:700 13px Sora;color:var(--mu)}
.x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--mu);line-height:1}
.qt{margin:0 0 12px;font-size:17px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--ln);border-radius:10px;background:#fff;cursor:pointer;font-size:16px;margin-bottom:9px}
.opt b{flex:none;width:26px;height:26px;border-radius:6px;background:#EEF2FA;display:grid;place-items:center;font:700 12px Sora}
.opt:hover{border-color:var(--fg)}.opt.ok{border-color:var(--ok);background:#F0FDF4}.opt.no{border-color:var(--no);background:#FEF2F2}.opt[disabled]{cursor:default}
.fd{border-radius:8px;padding:10px 12px;margin:6px 0 12px;font-size:15px}.fd.g{background:#DCFCE7;color:#166534}.fd.b{background:#FEE2E2;color:#991B1B}
.ex{background:#F5F7FB;border-radius:8px;padding:10px 12px;font-size:15px;margin-bottom:12px}
@media(min-width:720px){.nl{display:flex}.nv{padding:0 40px}.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header class="nv"><a class="logo" href="index.html">NEET Saathi</a><div class="nl"><a href="teacher.html">Ask Your Teacher</a><a href="test.html">Mock Test</a><a href="mistakes.html">Mistake Tracker</a><a href="plan.html">Daily Planner</a></div><a class="login" href="login.html">Log in</a></header>
<main class="w">
<h1>Weak Topics</h1><p class="mu" style="margin:0">Find exactly where you are losing marks, based on your test performance.</p>
<div id="body"></div>
</main>
<div class="md" id="md" hidden><div class="mb" id="mb"></div></div>
<script>
const SK=['Physics','Chemistry','Biology'],L='ABCD';
/* Practice question bank. Same format as the Mock Test page. Add more questions per topic here. */
const Q=[
{s:'Physics',t:'Work, Energy and Power',q:'A body of mass 2 kg is moving with a velocity of 3 m/s. Its kinetic energy is',o:['3 J','6 J','9 J','18 J'],a:2,e:'Kinetic energy = (1/2)mv² = (1/2) x 2 x 3² = 9 J.'},
{s:'Physics',t:'Electrostatics',q:'The SI unit of capacitance is',o:['Henry','Farad','Tesla','Weber'],a:1,e:'Capacitance is charge per unit potential difference (C/V). One coulomb per volt is called one farad.'},
{s:'Physics',t:'Ray Optics',q:'The focal length of a plane mirror is',o:['Zero','Infinity','Positive and finite','Negative and finite'],a:1,e:'A plane mirror has an infinite radius of curvature, so its focal length (R/2) is infinite.'},
{s:'Physics',t:'Kinematics',q:'A ball is thrown vertically upward with a speed of 20 m/s. Taking g = 10 m/s², the maximum height reached is',o:['10 m','20 m','40 m','5 m'],a:1,e:'At the top v = 0, so h = u²/2g = 400/20 = 20 m.'},
{s:'Physics',t:'Electromagnetic Waves',q:'Which of the following electromagnetic waves has the highest frequency?',o:['Radio waves','Microwaves','X-rays','Gamma rays'],a:3,e:'Among these, gamma rays have the shortest wavelength and therefore the highest frequency.'},
{s:'Chemistry',t:'Hydrocarbons',q:'The hybridisation of each carbon atom in ethene (C2H4) is',o:['sp','sp²','sp³','sp³d'],a:1,e:'Each carbon in ethene forms three sigma bonds and one pi bond, which corresponds to sp² hybridisation.'},
{s:'Chemistry',t:'Equilibrium',q:'The pH of a 0.01 M HCl solution is',o:['1','2','12','0.01'],a:1,e:'HCl is a strong acid, so [H+] = 0.01 M = 10⁻² M and pH = 2.'},
{s:'Chemistry',t:'Periodic Properties',q:'Which of the following elements is the most electronegative?',o:['Oxygen','Nitrogen','Fluorine','Chlorine'],a:2,e:'Fluorine has the highest electronegativity (4.0 on the Pauling scale).'},
{s:'Chemistry',t:'Mole Concept',q:'The number of moles in 36 g of water (molar mass 18 g/mol) is',o:['1','2','3','4'],a:1,e:'Moles = mass / molar mass = 36 / 18 = 2.'},
{s:'Chemistry',t:'Organic Nomenclature',q:'The IUPAC name of CH3CH2OH is',o:['Methanol','Ethanal','Ethanol','Propanol'],a:2,e:'Two carbon atoms give the stem "eth" and the OH group gives the suffix "ol", so the name is ethanol.'},
{s:'Biology',t:'Cell: Structure and Function',q:'Which cell organelle is known as the powerhouse of the cell?',o:['Ribosome','Golgi apparatus','Mitochondrion','Lysosome'],a:2,e:'Mitochondria produce most of the cell’s ATP through oxidative phosphorylation.'},
{s:'Biology',t:'Molecular Basis of Inheritance',q:'The semi-conservative nature of DNA replication was experimentally proved by',o:['Watson and Crick','Meselson and Stahl','Hershey and Chase','Griffith'],a:1,e:'Meselson and Stahl used 15N-labelled E. coli to show that DNA replication is semi-conservative.'},
{s:'Biology',t:'Photosynthesis',q:'The light reactions of photosynthesis take place in the',o:['Stroma','Thylakoid membranes','Outer membrane of chloroplast','Cytoplasm'],a:1,e:'The pigments and electron transport chain are located in the thylakoid membranes of the grana.'},
{s:'Biology',t:'Body Fluids and Circulation',q:'Which ABO blood group is considered the universal donor for red blood cells?',o:['A','B','AB','O'],a:3,e:'Group O red cells have neither A nor B antigens, so they can be given to recipients of any ABO group.'},
{s:'Biology',t:'Cell Cycle and Cell Division',q:'The normal number of chromosomes in a human somatic cell is',o:['23','44','46','48'],a:2,e:'Human somatic cells are diploid (2n) with 46 chromosomes, that is, 23 pairs.'}
];
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let tests=[],pr={},fs='All',pq=[],pi=0,pc=0,TP=[];
const col=a=>a<50?'var(--no)':a<75?'var(--am)':'var(--ok)',lab=a=>a<50?['r','Weak']:a<75?['a','Needs work']:['g','Strong'];
function topics(){const T={};
tests.forEach(t=>{Object.keys(t.topics||{}).forEach(k=>{const x=t.topics[k],o=T[k]=T[k]||{n:k,s:x.s,c:0,t:0,h:[]};o.c+=x.c;o.t+=x.t;o.h.push(x.t?Math.round(x.c/x.t*100):0)})});
Object.keys(pr).forEach(k=>{const q=Q.find(z=>z.t===k);if(!T[k]){if(!q)return;T[k]={n:k,s:q.s,c:0,t:0,h:[]}}T[k].c+=pr[k].c;T[k].t+=pr[k].t});
return Object.values(T).filter(x=>x.t).map(x=>({...x,a:Math.round(x.c/x.t*100)}))}
function render(){tests=load('neet_saathi_tests',[]);pr=load('neet_saathi_practice',{});TP=topics();const b=$('body');
if(!TP.length){b.innerHTML='<div class="em"><h2>No test data yet</h2><p>Take a mock test. Your weak topics are identified automatically from your test performance.</p><a class="bt" href="test.html" style="display:inline-block">Take a mock test</a></div>';return}
const tc=TP.reduce((s,x)=>s+x.c,0),tt=TP.reduce((s,x)=>s+x.t,0),oa=Math.round(tc/tt*100),weak=TP.filter(x=>x.a<60).length;
let imp='–',ic='';if(tests.length>1){const d=tests[tests.length-1].acc-tests[0].acc;imp=(d>0?'+':'')+d+' pts';ic=d>=0?'var(--ok)':'var(--no)'}
let h='<div class="stats"><div><b>'+tests.length+'</b><span>Tests taken</span></div><div><b>'+oa+'%</b><span>Overall topic accuracy</span></div><div><b style="color:'+(weak?'var(--no)':'var(--ok)')+'">'+weak+'</b><span>Weak topics (below 60%)</span></div><div><b'+(ic?' style="color:'+ic+'"':'')+'>'+imp+'</b><span>Improvement since first test</span></div></div>';
h+='<div class="how"><b>How this works.</b> After every mock test, accuracy is calculated for each topic. Topics with the lowest accuracy are listed first. Practice answers on this page are included in your topic accuracy, so you can watch a weak topic improve.</div>';
h+='<div class="cd"><h2>Subject-wise weakness</h2>'+SK.map(s=>{const g=TP.filter(x=>x.s===s);if(!g.length)return '<div class="rw"><div class="r1"><span>'+s+'</span><span class="mu">No data</span></div></div>';const c=g.reduce((u,x)=>u+x.c,0),t=g.reduce((u,x)=>u+x.t,0),a=Math.round(c/t*100),w=g.slice().sort((x,y)=>x.a-y.a)[0];return '<div class="rw"><div class="r1"><span>'+s+'</span><span>'+a+'%</span></div><small>Weakest topic: '+esc(w.n)+' ('+w.a+'%)</small><div class="bar"><i style="width:'+a+'%;background:'+col(a)+'"></i></div></div>'}).join('')+'</div>';
if(tests.length>1){const n=tests.slice(-10),W=400,H=120,P=n.map((t,i)=>[20+i*(W-40)/Math.max(1,n.length-1),H-20-t.acc*(H-40)/100,t.acc]);
h+='<div class="cd ch"><h2>Improvement over time</h2><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Accuracy across tests"><line x1="20" y1="'+(H-20)+'" x2="'+(W-20)+'" y2="'+(H-20)+'" stroke="#E2E7F0"/><polyline fill="none" stroke="#059669" stroke-width="2.5" points="'+P.map(p=>p[0]+','+p[1]).join(' ')+'"/>'+P.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#059669"/><text x="'+p[0]+'" y="'+(p[1]-9)+'" font-size="10" text-anchor="middle" fill="#0F1B33" font-family="Inter">'+p[2]+'%</text>').join('')+'</svg><small class="mu">Accuracy in your last '+n.length+' tests</small></div>'}
h+='<div class="fb" id="fs"><span class="l">Subject</span>'+['All',...SK].map(s=>'<button class="bg'+(fs===s?' on':'')+'" data-s="'+s+'">'+s+'</button>').join('')+'</div>';
const v=TP.filter(x=>fs==='All'||x.s===fs).sort((x,y)=>x.a-y.a);
h+='<div style="margin:6px 0 14px"><button class="bt pr" id="pw"'+(v.length?'':' disabled')+'>Practise my weakest topics</button></div>';
h+=v.map(x=>{const l=lab(x.a),n=x.h.length,tr=n>1?x.h[n-1]-x.h[n-2]:null;
return '<div class="cd"><div class="top"><div><div class="qh"><span class="tag">'+x.s+'</span><span class="tag '+l[0]+'">'+l[1]+'</span></div><p class="tn">'+esc(x.n)+'</p></div><div class="pc" style="color:'+col(x.a)+'">'+x.a+'%</div></div><small class="mu">'+x.c+' correct out of '+x.t+' questions'+(tr!=null?' · <span class="tr '+(tr>=0?'u':'d')+'">'+(tr>=0?'Up ':'Down ')+Math.abs(tr)+' pts since the previous test</span>':'')+'</small><div class="bar"><i style="width:'+x.a+'%;background:'+col(x.a)+'"></i></div><div class="ac"><button class="bg" data-p="'+esc(x.n)+'">Practise this topic</button></div></div>'}).join('')||'<div class="em"><h2>Nothing for this subject yet</h2><p>Try another subject.</p></div>';
b.innerHTML=h}
$('body').onclick=e=>{const s=e.target.dataset.s,p=e.target.dataset.p;if(s){fs=s;render()}if(p)open(Q.filter(q=>q.t===p));if(e.target.id==='pw'){const w=TP.filter(x=>fs==='All'||x.s===fs).sort((x,y)=>x.a-y.a).slice(0,3).map(x=>x.n);open(Q.filter(q=>w.includes(q.t)))}};
function open(q){if(!q.length)return;pq=q;pi=0;pc=0;$('md').hidden=false;ask()}
function ask(){const m=pq[pi];if(!m){fin();return}
$('mb').innerHTML='<div class="mh"><span>Practice · Question '+(pi+1)+' of '+pq.length+'</span><button class="x" id="cl" aria-label="Close">×</button></div><div class="qh"><span class="tag">'+m.s+'</span><span class="tag">'+esc(m.t)+'</span></div><p class="qt">'+esc(m.q)+'</p>'+m.o.map((o,k)=>'<button class="opt" data-k="'+k+'"><b>'+L[k]+'</b><span>'+esc(o)+'</span></button>').join('')+'<div id="fb"></div>';
$('cl').onclick=close}
function close(){$('md').hidden=true;render()}
function fin(){$('mb').innerHTML='<div class="mh"><span>Practice complete</span><button class="x" id="cl" aria-label="Close">×</button></div><h2>'+pc+' of '+pq.length+' answered correctly</h2><p class="mu">These answers have been added to your topic accuracy.</p><button class="bt" id="dn">Done</button>';$('cl').onclick=close;$('dn').onclick=close}
$('mb').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;const m=pq[pi],k=+b.dataset.k,ok=k===m.a;
[].forEach.call($('mb').querySelectorAll('.opt'),(o,i)=>{o.disabled=true;if(i===m.a)o.classList.add('ok');else if(i===k)o.classList.add('no')});
if(ok)pc++;const o=pr[m.t]=pr[m.t]||{c:0,t:0};o.t++;if(ok)o.c++;put('neet_saathi_practice',pr);
$('fb').innerHTML='<div class="fd '+(ok?'g':'b')+'">'+(ok?'Correct.':'Incorrect. The correct answer is '+L[m.a]+'.')+'</div><div class="ex"><b>Explanation.</b> '+esc(m.e)+'</div><button class="bt" id="nx">'+(pi<pq.length-1?'Next question':'Finish')+'</button>';
$('nx').onclick=()=>{pi++;if(pi<pq.length)ask();else fin()}};
addEventListener('storage',render);render();
</script></body></html>
